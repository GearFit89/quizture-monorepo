---
name: Set up Node and dependencies
description: Node 22 with npm 11 (the lockfile needs it) and npm ci.
runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - name: Install npm 11
      shell: bash
      run: npm install -g npm@11
    - name: Install dependencies
      shell: bash
      run: npm ci --ignore-scripts --no-audit --no-fund
